  :root{
    --bg:#031006;
    --bg2:#06200c;
    --panel:#0a2d11;
    --panel2:#0f3d18;
    --borde:#1c7a27;
    --lima:#6cf21a;
    --verde:#22d322;
    --blanco:#ffffff;
    --muted:#a3cba6;
    --alerta:#ffb020;
    --error:#ff5252;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; background:#031006; }
  body{
    margin:0; padding:22px;
    font-family:'Exo 2',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:22px; line-height:1.3; color:var(--blanco);
    font-variant-numeric:tabular-nums;
    background:radial-gradient(1300px 760px at 50% -10%, #0f4f1c 0%, var(--bg2) 46%, var(--bg) 100%) fixed;
    min-height:100vh;
  }

  /* ---------- Encabezado ---------- */
  .top{ display:grid; grid-template-columns:1fr auto; gap:22px; align-items:center; margin-bottom:20px; }
  .marca{ display:flex; align-items:center; gap:22px; min-width:0; }
  .logo{ width:132px; height:132px; flex:none; filter:drop-shadow(0 0 18px rgba(80,255,40,.35)); }
  h1{ margin:0; font-size:clamp(34px,4.6vw,58px); line-height:1.05; font-weight:800; letter-spacing:-.01em; }
  h1 span{ color:var(--lima); }
  .ver{ display:inline-block; margin-left:12px; padding:1px 10px; border:1px solid var(--lima); border-radius:999px; color:var(--lima); font-weight:700; letter-spacing:.06em; text-transform:none; vertical-align:middle; }
  .sub{ margin-top:6px; font-size:20px; color:var(--muted); letter-spacing:.14em; text-transform:uppercase; }

  .clima{
    display:grid; grid-template-columns:auto auto; gap:6px 22px; align-items:center;
    background:linear-gradient(160deg,var(--panel2),var(--panel)); border:2px solid var(--borde);
    border-radius:24px; padding:16px 24px; min-width:430px;
  }
  .clima-main{ display:flex; align-items:center; gap:14px; }
  .clima-ico{ font-size:68px; line-height:1; }
  .clima-temp{ font-size:68px; font-weight:800; line-height:1; }
  .clima-desc{ font-size:22px; color:var(--lima); font-weight:600; }
  .clima-det{ font-size:20px; color:var(--muted); line-height:1.5; }
  .clima-det b{ color:var(--blanco); font-weight:600; }
  .clima-lugar{ grid-column:1 / -1; font-size:19px; color:var(--muted); border-top:1px solid rgba(255,255,255,.12); padding-top:8px; }

  .semana{ grid-column:1 / -1; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; border-top:1px solid rgba(255,255,255,.12); padding-top:8px; }
  .dia{ text-align:center; font-size:15px; line-height:1.25; color:var(--muted); background:rgba(0,0,0,.22); border-radius:10px; padding:6px 2px; }
  .dia .dn{ font-weight:700; color:var(--blanco); text-transform:capitalize; }
  .dia .di{ font-size:24px; line-height:1.2; }
  .dia .dx{ color:var(--blanco); font-weight:700; }
  .dia .dm{ color:var(--muted); }
  .dia .dl{ color:#7fc4ff; font-size:13px; }

  /* ---------- Botones ---------- */
  .acciones{ display:flex; flex-wrap:wrap; gap:14px; margin-bottom:20px; }
  .btn{
    font:inherit; font-size:22px; font-weight:700; cursor:pointer;
    min-height:62px; padding:14px 28px; border-radius:18px;
    border:2px solid var(--lima); background:var(--lima); color:#062a0b;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{ transform:scale(.98); }
  .btn.peligro{ background:transparent; color:#ff8080; border-color:var(--error); margin-left:auto; }
  .btn.grande{ background:#fff; border-color:#fff; color:#0a4a14; }
  .cola{ display:none; align-items:center; gap:14px; flex-wrap:wrap; padding:14px 20px; border-radius:16px; margin-bottom:18px;
         background:rgba(108,242,26,.12); border:2px solid var(--lima); font-size:22px; }
  .cola span{ flex:1 1 260px; }
  .cola .btn{ min-height:54px; }
  .btn.sec{ background:transparent; color:var(--lima); font-size:18px; min-height:48px; padding:8px 18px; }

  .aviso{ display:none; padding:14px 20px; border-radius:16px; margin-bottom:18px; font-size:21px; font-weight:600; }
  .aviso.warn{ background:rgba(255,176,32,.16); color:var(--alerta); border:2px solid var(--alerta); }
  .aviso.err{ background:rgba(255,82,82,.14); color:#ff8c8c; border:2px solid var(--error); }
  .aviso.warn, .aviso.err, .alarma{ display:flex; align-items:center; gap:14px; }
  .aviso .msg, .alarma .msg{ flex:1; }
  .aviso .cerrar, .alarma .cerrar{ flex:none; font:inherit; font-size:.8em; font-weight:700; color:inherit; background:rgba(0,0,0,.25); border:2px solid currentColor; border-radius:12px; padding:6px 16px; cursor:pointer; white-space:nowrap; }
  .alarmas{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .alarmas:empty{ display:none; }
  .alarma{ padding:14px 20px; border-radius:16px; font-size:21px; font-weight:600; background:rgba(255,176,32,.16); color:var(--alerta); border:2px solid var(--alerta); }
  .alarma::before{ content:'\26A0'; font-size:1.2em; }

  /* ---------- Tarjetas ---------- */
  .tarjetas{ display:grid; grid-template-columns:repeat(auto-fit,minmax(480px,1fr)); gap:20px; align-items:start; }
  .vacio{ padding:44px 20px; text-align:center; color:var(--muted); font-size:24px; border:2px dashed var(--borde); border-radius:24px; }
  .card{
    background:linear-gradient(165deg,var(--panel2) 0%,var(--panel) 60%);
    border:2px solid var(--borde); border-radius:28px; padding:22px 24px 16px;
    box-shadow:0 0 28px rgba(60,230,40,.08);
  }
  .card-h{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; }
  .card-t{ font-size:32px; font-weight:800; color:var(--lima); line-height:1.1; }
  .card-s{ font-size:20px; color:var(--muted); margin-top:4px; }
  .card-f{ font-size:18px; color:var(--muted); margin-top:16px; padding-top:12px; border-top:1px solid rgba(255,255,255,.1); }
  .card-f:empty{ display:none; }
  #jk, #daly{ align-self:stretch; }
  .card-f.ok{ color:var(--lima); } .card-f.aviso{ color:var(--alerta); } .card-f.error{ color:var(--error); }

  .chips{ display:flex; flex-wrap:wrap; gap:10px; }
  .chip{ display:inline-block; padding:7px 18px; border-radius:999px; font-size:21px; font-weight:700; max-width:100%; }
  .chip.ok{ background:var(--lima); color:#052208; }
  .chip.off{ background:rgba(255,255,255,.16); color:#fff; }
  .chip.warn{ background:var(--alerta); color:#2a1a00; }
  .chip.err{ background:var(--error); color:#fff; }
  .chip.bal{ background:#fff; color:#0a4a14; }

  .hero{ display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:16px; align-items:center; margin-bottom:16px; }
  .hero-g{ display:flex; gap:10px; justify-content:center; }
  .hero-c{ display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
  .hero-c{ min-width:0; }
  .hero-c .chips{ flex-direction:column; align-items:flex-start; }
  .chip{ white-space:normal; line-height:1.2; }

  .gauge{ position:relative; width:100%; max-width:330px; }
  .gauge svg{ display:block; width:100%; }
  .gv{ position:absolute; left:0; right:0; bottom:0; text-align:center; font-size:clamp(46px,5.6vw,68px); font-weight:800; line-height:1; }
  .gv small{ display:block; font-size:19px; font-weight:500; color:var(--muted); margin-top:6px; }
  .gauge.mini .gv{ position:static; font-size:clamp(34px,3.6vw,42px); margin-top:-6px; }
  .gauge.mini .gv small{ font-size:16px; margin-top:2px; }

  .tiles{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .tile{ background:rgba(0,0,0,.28); border:1px solid rgba(108,242,26,.18); border-radius:18px; padding:12px 16px; }
  .tl{ font-size:17px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .tv{ font-size:42px; font-weight:800; line-height:1.15; }
  .tv small{ font-size:22px; font-weight:500; color:var(--muted); margin-left:6px; }
  .tile.warn .tv{ color:var(--alerta); } .tile.err .tv{ color:var(--error); }

  .sec{ font-size:19px; text-transform:uppercase; letter-spacing:.12em; color:var(--lima); margin:18px 0 8px; }
  .celdas{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }

  /* ===== Compacto: encabezado proporcionado y 4 tarjetas en un renglón ===== */
  body{ padding:14px 16px; }
  .top{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:stretch; margin-bottom:12px; }
  .marca{ gap:16px; }

  .clima-top{ display:flex; align-items:center; justify-content:space-between; gap:14px; }

  .clima-ico{ font-size:42px; } .clima-temp{ font-size:44px; } .clima-desc{ font-size:16px; }

  .cola .btn{ min-height:44px; }

  .tarjetas{ grid-template-columns:repeat(auto-fit,minmax(min(100%,255px),1fr)); gap:12px; }

  .card-t{ font-size:clamp(20px,8cqw,32px); }

  /* ===== v2.2: más chico para iPad (~1080 px): botones en una línea y 4 tarjetas sin que se pase la letra ===== */

<script>
const MODO = 'remoto';   // 'local' (con Bluetooth, publica) | 'remoto' (solo mira)
/* =====================================================
   Utilidades generales
   ===================================================== */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const logEl = $('log');
function log(m){ logEl.textContent += m + '\n'; logEl.scrollTop = logEl.scrollHeight; }
const uuid128 = n => '0000' + n.toString(16).padStart(4,'0') + '-0000-1000-8000-00805f9b34fb';
// Pide el equipo; si el navegador (ej. Bluefy) rechaza el primer intento por un error raro, reintenta con otra forma de pedirlo
async function pedirDispositivo(nombre, intentos){
  let ultimo;
  for(let i = 0; i < intentos.length; i++){
    try{ return await navigator.bluetooth.requestDevice(intentos[i]); }
    catch(e){
      ultimo = e;
      log(nombre + ': intento ' + (i+1) + ' de elegir equipo falló → ' + (e && e.name ? e.name + ': ' : '') + ((e && e.message) || e) + ' [' + typeof e + ']');
      if(clasificarError(e) !== 'error') throw e;
    }
  }
  throw ultimo;
}
function aviso(msg, nivel){
  const el = $('aviso');
  if(!msg){ el.style.display = 'none'; el.textContent = ''; return; }
  el.className = 'aviso ' + (nivel || 'warn');
  el.textContent = '';
  const m = document.createElement('span'); m.className = 'msg'; m.textContent = msg;
  const b = document.createElement('button'); b.className = 'cerrar'; b.textContent = 'Desestimar';
  b.onclick = () => aviso('');
  el.append(m, b);
  el.style.display = 'flex';
}

// ---- Centro de alarmas: mensajes naranja con botón Desestimar ----
const alarmasAct = new Map();      // id -> mensaje activo
const alarmasOff = new Map();      // id -> mensaje desestimado (no reaparece mientras sea el mismo)
function alarma(id, msg){
  if(alarmasOff.get(id) === msg) return;
  if(alarmasAct.get(id) === msg) return;
  alarmasAct.set(id, msg); pintarAlarmas();
}
function alarmaOk(id){
  alarmasOff.delete(id);
  if(alarmasAct.delete(id)) pintarAlarmas();
}
function alarmasLimpiar(prefijo){
  for(const id of [...alarmasAct.keys(), ...alarmasOff.keys()]) if(id.startsWith(prefijo)) alarmaOk(id);
}
function pintarAlarmas(){
  const cont = $('alarmas'); cont.textContent = '';
  for(const [id, msg] of alarmasAct){
    const d = document.createElement('div'); d.className = 'alarma';
    const m = document.createElement('span'); m.className = 'msg'; m.textContent = msg;
    const b = document.createElement('button'); b.className = 'cerrar'; b.textContent = 'Desestimar';
    b.onclick = () => { alarmasOff.set(id, msg); alarmasAct.delete(id); pintarAlarmas(); };
    d.append(m, b); cont.append(d);
  }
}
const JK_ALARMAS = ['Temp. MOS alta','Cantidad de celdas','Sensor de corriente','Sobretensión celda','Sobretensión batería','Sobrecorriente carga','Cortocircuito carga','Temp. alta carga','Temp. baja carga','Comunicación','Subtensión celda','Subtensión batería','Sobrecorriente descarga','Cortocircuito descarga','Temp. alta descarga','Temp. baja descarga'];
function textoAlarmaJK(a){
  const n = JK_ALARMAS.filter((_, i) => a & (1 << i));
  return 'JK BMS · alarma 0x' + a.toString(16).toUpperCase().padStart(4,'0') + (n.length ? ' (posible: ' + n.join(', ') + ')' : '');
}
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function horaDe(ms){ return new Date(ms).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', second:'2-digit'}); }
const hexDe = u8 => Array.from(u8).map(b => b.toString(16).padStart(2,'0')).join(' ');

function aUint8(x){
  if(x instanceof Uint8Array) return x;
  if(x instanceof ArrayBuffer) return new Uint8Array(x);
  if(ArrayBuffer.isView(x)) return new Uint8Array(x.buffer, x.byteOffset, x.byteLength);
  if(Array.isArray(x)) return new Uint8Array(x);
  return null;
}

/* Piezas visuales compartidas */
function gauge(frac, grande, etiqueta, color, mini){
  const largo = Math.PI * 90;
  const f = isFinite(frac) ? Math.max(0, Math.min(1, frac)) : 0;
  return '<div class="gauge' + (mini ? ' mini' : '') + '"><svg viewBox="0 0 200 108">' +
    '<path d="M 10 100 A 90 90 0 0 1 190 100" fill="none" style="stroke:rgba(255,255,255,.14)" stroke-width="16" stroke-linecap="round"/>' +
    (f > 0 ? '<path d="M 10 100 A 90 90 0 0 1 190 100" fill="none" style="stroke:' + color + '" stroke-width="16" stroke-linecap="round" stroke-dasharray="' +
      (largo * f).toFixed(1) + ' ' + largo.toFixed(1) + '"/>' : '') +
    '</svg><div class="gv">' + grande + '<small>' + etiqueta + '</small></div></div>';
}
function tile(label, valor, unidad, clase, attr){
  return '<div class="tile ' + (clase || '') + '" ' + (attr || '') + '><div class="tl">' + label + '</div><div class="tv">' + valor +
         (unidad ? '<small>' + unidad + '</small>' : '') + '</div></div>';
}
function tiles(arr){ return '<div class="tiles">' + arr.join('') + '</div>'; }
function chips(arr){ return '<div class="chips">' + arr.map(c => '<span class="chip ' + c[1] + '">' + c[0] + '</span>').join('') + '</div>'; }
function hero(g, c){ return '<div class="hero"><div class="hero-g">' + g + '</div><div class="hero-c">' + c + '</div></div>'; }
function seccion(t){ return '<div class="sec">' + t + '</div>'; }
function det(t){ return '<div class="det">' + t + '</div>'; }
function colorSOC(soc){ return soc < 20 ? 'var(--error)' : soc < 50 ? 'var(--alerta)' : 'var(--lima)'; }
function vNum(raw, na, div){ return raw === na ? null : raw / div; }
function fN(x, dec){ return (x === null || x === undefined || !isFinite(x)) ? '—' : x.toFixed(dec); }

/* =====================================================
   JK BMS
   ===================================================== */
const JK_SERVICE = 0xFFE0, JK_CHAR = 0xFFE1;
const jk = { dev:null, ch:null, onNotif:null, buffer:new Uint8Array(0), ultimaTrama:null, info:null, ultima:0, quiere:false, reconectando:false, nudged:false };

// Abre la conexión, escucha y pide los datos. Se usa al conectar y en cada reconexión.
async function sesionJK(dev){
  const server = await dev.gatt.connect();
  const svc = await server.getPrimaryService(JK_SERVICE);
  const ch = await svc.getCharacteristic(JK_CHAR);
  if(jk.ch && jk.onNotif){ try{ jk.ch.removeEventListener('characteristicvaluechanged', jk.onNotif); }catch(e){} }
  await ch.startNotifications();
  jk.onNotif = e => recibirJK(e.target.value, dev.name);
  ch.addEventListener('characteristicvaluechanged', jk.onNotif);
  jk.ch = ch; jk.buffer = new Uint8Array(0); jk.nudged = false;
  // 0x97 = info del dispositivo, 0x96 = datos de celdas. Después el BMS transmite solo.
  await ch.writeValue(comandoJK(0x97));
  await sleep(400);
  await ch.writeValue(comandoJK(0x96));
}

async function conectarJK(){
  try{
    if(jk.dev && (jk.dev.gatt.connected || jk.reconectando)){ aviso('El JK BMS ya está conectado.', 'warn'); return 'ok'; }
    const dev = await pedirDispositivo('JK', [
      { filters:[{services:[JK_SERVICE]}, {namePrefix:'JK'}], optionalServices:[JK_SERVICE] },
      { acceptAllDevices:true, optionalServices:[uuid128(JK_SERVICE)] }
    ]);
    jk.quiere = false; jk.reconectando = false;
    jk.dev = dev; jk.ultima = 0; jk.buffer = new Uint8Array(0); jk.ch = null;
    tarjeta('jk', 'JK BMS', dev.name || '');
    setChip('jk', 'Conectando', 'off');
    setCuerpo('jk', '<div class="espera">Conectando con el BMS…</div>');
    setPie('jk', '', '');
    dev.addEventListener('gattserverdisconnected', () => {
      if(jk.dev !== dev) return;
      log('JK: desconectado');
      if(jk.quiere){ reconectarJK(); }
      else { setChip('jk', 'Desconectado', 'err'); setPie('jk', 'Se perdió la conexión Bluetooth con el BMS.', 'error'); }
    });
    log('JK: conectando a ' + dev.name);
    await sesionJK(dev);
    jk.quiere = true;                 // desde acá, si se corta, se reconecta solo
    log('JK: comandos enviados');
    aviso('');
    return 'ok';
  }catch(err){
    log('JK error: ' + err);
    const k = clasificarError(err);
    if(k === 'gesto') return k;
    if(k === 'cancelado'){ aviso('JK: no elegiste ningún dispositivo.', 'warn'); return k; }
    aviso('JK: ' + err, 'err');
    if(document.getElementById('jk')){ setChip('jk', 'Error', 'err'); setPie('jk', String(err), 'error'); }
    return k;
  }
}

// Reintenta sin parar (cada vez un poco más espaciado, hasta 10 s) hasta que vuelve o se toca "Desconectar todo"
async function reconectarJK(){
  if(jk.reconectando || !jk.quiere || !jk.dev) return;
  jk.reconectando = true;
  const dev = jk.dev; let n = 0;
  while(jk.quiere && jk.dev === dev){
    n++;
    setChip('jk', 'Reconectando', 'warn');
    setPie('jk', 'Conexión perdida. Reintentando… (intento ' + n + ')', 'aviso');
    await sleep(Math.min(2000 + n * 1500, 10000));
    if(!(jk.quiere && jk.dev === dev)) break;
    try{
      await sesionJK(dev);
      jk.ultima = 0;
      log('JK: reconectado (intento ' + n + ')');
      break;
    }catch(e){
      log('JK: reintento ' + n + ' falló: ' + e);
      try{ dev.gatt.disconnect(); }catch(_){}
    }
  }
  jk.reconectando = false;
}

function comandoJK(codigo){
  const b = new Uint8Array(20);
  b[0]=0xAA; b[1]=0x55; b[2]=0x90; b[3]=0xEB; b[4]=codigo;
  let crc = 0; for(let i=0;i<19;i++) crc = (crc + b[i]) & 0xFF;
  b[19]=crc;
  return b;
}

function recibirJK(dv, nombre){
  const chunk = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  // Una trama empieza con 55 AA EB 90 y mide 300 bytes; llega en varios paquetes
  if(chunk.length >= 4 && chunk[0]==0x55 && chunk[1]==0xAA && chunk[2]==0xEB && chunk[3]==0x90){
    jk.buffer = new Uint8Array(0);
  }
  const nuevo = new Uint8Array(jk.buffer.length + chunk.length);
  nuevo.set(jk.buffer); nuevo.set(chunk, jk.buffer.length);
  jk.buffer = nuevo;
  if(jk.buffer.length >= 300){
    const trama = jk.buffer.slice(0, 300);
    jk.buffer = new Uint8Array(0);
    jk.ultimaTrama = trama;
    if(trama[4] === 0x02) decodificarJKCeldas(trama);
    else if(trama[4] === 0x03) decodificarJKInfo(trama);
    else log('JK: trama tipo 0x' + trama[4].toString(16) + ' (' + trama.length + ' bytes)');
  }
}

function textoDe(t, desde, largo){
  return new TextDecoder().decode(t.slice(desde, desde + largo)).replace(/\0/g, '').trim();
}

function decodificarJKInfo(t){
  const v = new DataView(t.buffer, t.byteOffset, t.byteLength);
  jk.info = {
    modelo: textoDe(t,6,16), hardware: textoDe(t,22,8), software: textoDe(t,30,8),
    uptime: v.getUint32(38,true), encendidos: v.getUint32(42,true),
    nombre: textoDe(t,46,16), fecha: textoDe(t,78,8), serie: textoDe(t,86,11)
  };
  log('JK info: ' + JSON.stringify(jk.info));
}

function decodificarJKCeldas(t){
  const v = new DataView(t.buffer, t.byteOffset, t.byteLength);
  const u8  = o => t[o];
  const u16 = o => v.getUint16(o, true);
  const i16 = o => v.getInt16(o, true);
  const u32 = o => v.getUint32(o, true);
  const i32 = o => v.getInt32(o, true);

  const celdas = [];
  for(let i=0;i<32;i++){ const mv = u16(6 + i*2); if(mv > 0) celdas.push(mv/1000); }
  if(!celdas.length) return;

  const promedio  = u16(74) / 1000;
  const delta     = u16(76) / 1000;
  const celdaMax  = u8(78) + 1;
  const celdaMin  = u8(79) + 1;

  // Posiciones de la familia JK (firmware 10.x / 11.x, layout de 32 celdas)
  const tempMOS      = i16(144) / 10;
  const voltajeTotal = u32(150) / 1000;
  const corriente    = i32(158) / 1000;
  const temp1        = i16(162) / 10;
  const temp2        = i16(164) / 10;
  const alarmas      = u16(166);
  if(alarmas) alarma('jk', textoAlarmaJK(alarmas)); else alarmaOk('jk');
  const corrBalance  = i16(168) / 1000;
  const accionBal    = u8(170);
  const soc          = u8(173);
  const capRestante  = u32(174) / 1000;
  const capNominal   = u32(178) / 1000;
  const ciclos       = u32(182);
  const capCiclos    = u32(186) / 1000;
  const tiempoOn     = u32(194);
  const mosCarga     = u8(198);
  const mosDescarga  = u8(199);
  const potencia     = voltajeTotal * corriente;

  jk.ultima = Date.now(); jk.nudged = false;
  const max = Math.max(...celdas), min = Math.min(...celdas);
  const dias = Math.floor(tiempoOn/86400), horas = Math.floor((tiempoOn%86400)/3600);
  const balChip = accionBal === 0 ? ['Balance OFF','off'] : (accionBal === 1 || accionBal === 2) ? ['Balance ON','bal'] : ['Balance ?','off'];
  const sentido = corriente > 0.05 ? 'cargando' : corriente < -0.05 ? 'descargando' : 'reposo';

  setChip('jk', 'Conectado', 'ok');
  setCuerpo('jk',
    hero(
      gauge(soc/100, soc + '%', 'Estado de carga', colorSOC(soc)),
      chips([
        ['Carga ' + (mosCarga ? 'ON' : 'OFF'), mosCarga ? 'ok' : 'err'],
        ['Descarga ' + (mosDescarga ? 'ON' : 'OFF'), mosDescarga ? 'ok' : 'err'],
        balChip
      ])
    ) +
    tiles([
      tile('Voltaje', fN(voltajeTotal,2), 'V'),
      tile('Corriente ' + (corriente > 0.05 ? '▲' : corriente < -0.05 ? '▼' : ''), fN(corriente,2), 'A'),
      tile('Potencia', fN(potencia,0), 'W'),
      tile('Restante', fN(capRestante,0), 'Ah'),
      tile('Temperatura', fN(temp1,1), '°C', temp1 > 50 ? 'err' : temp1 > 40 ? 'warn' : ''),
      tile('Dif. celdas', ((max-min)*1000).toFixed(0), 'mV', (max-min) > 0.1 ? 'err' : (max-min) > 0.05 ? 'warn' : ''),
      tile('Celda prom.', fN(promedio,3), 'V'),
      tile('Ciclos', String(ciclos), '(' + capCiclos.toFixed(0) + ' Ah)')
    ]) +
    seccion('Celdas') +
    '<div class="celdas">' + celdas.map((x,i) => {
      const cls = (max !== min && x === max) ? 'max' : (max !== min && x === min) ? 'min' : '';
      return '<div class="celda ' + cls + '"><span>C' + (i+1) + '</span><b>' + x.toFixed(3) + '</b></div>';
    }).join('') + '</div>' +
    seccion('Alarmas') +
    det('<b>' + (alarmas === 0 ? 'Sin alarmas' : 'Código 0x' + alarmas.toString(16).toUpperCase().padStart(4,'0')) + '</b>')
  );
}

function volcarTrama(){

  log('JK trama (' + jk.ultimaTrama.length + ' bytes):\n' + hexDe(jk.ultimaTrama));
}

/* =====================================================
   Victron (lectura por Bluetooth "Instant readout")
   ===================================================== */
const victronConex = new Map();

// Claves de cifrado conocidas. Las que se escriben una vez quedan guardadas solo en este navegador.
const CLAVES_FIJAS = { 'Victron Orion XS': '180586317e79174dca2b845f55a159ad' };
function claveGuardada(rotulo){
  if(CLAVES_FIJAS[rotulo]) return CLAVES_FIJAS[rotulo];
  try{ return localStorage.getItem('clave:' + rotulo) || ''; }catch(e){ return ''; }
}
function guardarClave(rotulo, hex){ try{ localStorage.setItem('clave:' + rotulo, hex); }catch(e){} }
function olvidarClaves(){
  try{ Object.keys(localStorage).filter(k => k.startsWith('clave:')).forEach(k => localStorage.removeItem(k)); }catch(e){}
  log('Claves guardadas en este navegador: borradas');
  aviso('Se borraron las claves guardadas en este navegador.', 'warn');
}

function clasificarError(err){
  const n = (err && err.name) || '', m = String((err && err.message) || err).toLowerCase();
  if(n === 'SecurityError' || m.includes('user gesture') || m.includes('user activation')) return 'gesto';
  if(n === 'NotFoundError' || m.includes('cancel')) return 'cancelado';
  return 'error';
}

function paresFabricante(ev){
  const md = ev.manufacturerData;
  if(!md) return [];
  if(typeof md.entries === 'function') return Array.from(md.entries());
  return Object.entries(md);
}
// Busca los datos de Victron aunque el navegador los entregue de otra forma (con o sin ID de fabricante)
function victronDeEvento(ev){
  for(const [k, dv] of paresFabricante(ev)){
    const u = aUint8(dv);
    if(!u) continue;
    if(Number(k) === 0x02E1) return u;
    if(u.length > 2 && u[0] === 0xE1 && u[1] === 0x02) return u.slice(2);
  }
  return null;
}
function describirEvento(ev){
  if(!ev.manufacturerData){
    return 'el evento no trae manufacturerData (propiedades: ' + Object.getOwnPropertyNames(Object.getPrototypeOf(ev)).join(', ') + ')';
  }
  const pares = paresFabricante(ev);
  if(!pares.length) return 'datos de fabricante: ninguno';
  return 'datos de fabricante: ' + pares.map(([k, dv]) => {
    const u = aUint8(dv);
    return '0x' + Number(k).toString(16) + ' → ' + (u ? hexDe(u) : String(dv));
  }).join(' | ');
}

async function conectarVictron(rotulo){
  try{
    let claveHex = claveGuardada(rotulo);
    if(!claveHex){
      claveHex = prompt('Pegá la clave de cifrado (32 caracteres) de: ' + rotulo);
      if(!claveHex) return 'cancelado';
    }
    const limpia = claveHex.replace(/[^0-9a-fA-F]/g, '');
    if(limpia.length !== 32){
      aviso('La clave debe tener 32 caracteres hexadecimales (la que pegaste tiene ' + limpia.length + ').', 'err');
      return 'error';
    }
    guardarClave(rotulo, limpia.toLowerCase());
    const clave = new Uint8Array(limpia.match(/../g).map(h => parseInt(h,16)));

    const dev = await pedirDispositivo(rotulo, [
      { acceptAllDevices:true, optionalManufacturerData:[0x02E1] }
    ]);
    log(rotulo + ': elegiste "' + (dev.name || '(sin nombre)') + '" · id ' + String(dev.id || '').slice(0, 8));
    if(typeof dev.watchAdvertisements !== 'function'){
      aviso('Tu navegador no tiene activada la lectura de publicidad Bluetooth: abrí chrome://flags (o edge://flags), activá "Experimental Web Platform features" y reiniciá.', 'err');
      return 'error';
    }
    const id = 'v-' + String(dev.id || dev.name || victronConex.size).replace(/[^a-zA-Z0-9_-]/g, '');
    if(victronConex.has(id)){ aviso('Ese dispositivo ya está conectado.', 'warn'); return 'ok'; }

    const cryptoKey = await crypto.subtle.importKey('raw', clave, 'AES-CTR', false, ['decrypt']);
    const con = {
      id, rotulo, dev, nombre: dev.name || rotulo, abort: new AbortController(),
      clave0: clave[0], cryptoKey, paquetes:0, victron:0, decod:0, claveMala:0,
      avisoClave:false, inicio:Date.now(), ultima:0, pico:0, tipos:{}
    };
    victronConex.set(id, con);
    tarjeta(id, rotulo.replace('Victron ', ''), con.nombre);
    setChip(id, 'Esperando datos', 'off');
    setCuerpo(id, '<div class="espera">Escuchando al equipo…</div>');

    dev.addEventListener('advertisementreceived', ev => procesarVictron(con, ev));
    await dev.watchAdvertisements({signal: con.abort.signal});
    log(rotulo + ': escuchando a ' + con.nombre);
    aviso('');
    return 'ok';
  }catch(err){
    log('Victron error: ' + err);
    const k = clasificarError(err);
    if(k === 'gesto') return k;
    if(k === 'cancelado'){ aviso(rotulo + ': no elegiste ningún dispositivo.', 'warn'); return k; }
    aviso('Victron: ' + err, 'err');
    return k;
  }
}

async function procesarVictron(con, ev){
  con.paquetes++;
  let datos = null;
  try{
    datos = victronDeEvento(ev);
    if(con.paquetes <= 3 || (!datos && con.paquetes % 25 === 0)){
      { const o = {}; for(const k of ['name','rssi','txPower','appearance']) if(ev[k] !== undefined && ev[k] !== null) o[k] = ev[k]; o.uuids = (ev.uuids || []).length; o.serviceData = ev.serviceData ? ev.serviceData.size : '-'; o.mfr = ev.manufacturerData ? ev.manufacturerData.size : '-'; con.detalle = JSON.stringify(o); if(con.paquetes <= 3) log(con.rotulo + ': detalle paquete #' + con.paquetes + ' ' + con.detalle); }
      log(con.rotulo + ': paquete #' + con.paquetes + ' · ' + ev.rssi + ' dBm · ' + describirEvento(ev));
    }
  }catch(e){ log(con.rotulo + ': no pude leer el paquete: ' + e); return; }
  if(!datos) return;
  con.victron++;
  try{ await decodificarVictron(con, datos); }
  catch(e){ log(con.rotulo + ' error al decodificar: ' + e); }
}

const SOLAR_MAX_A = 20;   // SmartSolar 100/20: 20 A de salida a batería
const VIC_ESTADOS = {0:'Apagado',1:'Bajo consumo',2:'Falla',3:'Bulk',4:'Absorción',5:'Flotación',6:'Almacenamiento',7:'Ecualización',9:'Inversor',11:'Fuente de poder',245:'Arrancando',246:'Absorción repetida',247:'Ecualización automática',248:'BatterySafe',252:'Control externo'};

// Códigos de error del cargador (tabla estándar Victron): texto corto para mostrar en la tarjeta
const VIC_ERRORES = {2:'Tensión batería alta',17:'Temp. cargador alta',18:'Sobrecorriente',19:'Corriente invertida',20:'Tiempo bulk excedido',21:'Sensor de corriente',
  26:'Bornes recalentados',28:'Falla convertidor',33:'Tensión PV alta',34:'Corriente PV alta',38:'Apagado por entrada',39:'Apagado por entrada',65:'Comunicación perdida',
  66:'Carga sincronizada',67:'BMS desconectado',68:'Red mal configurada',114:'Temp. CPU alta',116:'Calibración perdida',117:'Firmware incompatible',119:'Ajustes inválidos'};
const vicErrorTxt = e => VIC_ERRORES[e] ? VIC_ERRORES[e] + ' (' + e + ')' : 'Código ' + e;

function vicMotivosApagado(mask){
  const motivos = [[0x01,'sin tensión de entrada suficiente'],[0x02,'interruptor apagado'],[0x04,'apagado por modo del equipo'],
    [0x08,'entrada remota'],[0x10,'protección activa'],[0x20,'Paygo'],[0x40,'BMS'],
    [0x80,'detección de motor apagado'],[0x100,'analizando tensión de entrada']];
  return motivos.filter(m => mask & m[0]).map(m => m[1]).join(', ');
}

const ORION_MAX_A = 50;   // corriente máxima del Orion XS 12/12-50A (escala de las medialunas)

async function decodificarVictron(con, d){
  // Formato: d[0]=0x10, d[1]=byte extra, d[2..3]=modelo, d[4]=tipo de registro, d[5..6]=nonce, d[7]=primer byte de la clave, d[8..]=datos cifrados
  if(d[0] !== 0x10 || d.length < 9) return;
  if(d[7] !== con.clave0){
    con.claveMala++;
    if(!con.avisoClave){
      log(con.rotulo + ': la clave no coincide. Este equipo espera una clave que empiece con "' + d[7].toString(16).padStart(2,'0') +
          '" y la que pegaste empieza con "' + con.clave0.toString(16).padStart(2,'0') + '".');
      con.avisoClave = true;
    }
    return;
  }
  const tipo = d[4];
  const nonce = d[5] | (d[6] << 8);
  const cifrado = d.slice(8);
  const contador = new Uint8Array(16);
  contador[0] = nonce & 0xFF; contador[1] = nonce >> 8;
  const plano = new Uint8Array(await crypto.subtle.decrypt(
    {name:'AES-CTR', counter:contador, length:128}, con.cryptoKey, cifrado));
  con.decod++; con.ultima = Date.now();
  if(!con.tipos[tipo]){
    con.tipos[tipo] = true;
    log(con.rotulo + ': registro tipo 0x' + tipo.toString(16) + ' · ' + plano.length + ' bytes · ' + hexDe(plano));
  }
  pintarVictron(con, tipo, plano);
}

function pintarVictron(con, tipo, plano){
  const v = new DataView(plano.buffer, plano.byteOffset, plano.byteLength);
  const id = con.id;
  const estado = plano[0], err = plano[1];
  const estadoTxt = VIC_ESTADOS[estado] || ('Estado ' + estado);
  if(err) alarma('vic-' + id, (con.rotulo || id) + ' · error: ' + vicErrorTxt(err)); else alarmaOk('vic-' + id);
  const estadoChip = estado === 0 ? 'Apagado' : estado === 2 ? 'Falla' : 'Encendido · ' + estadoTxt;
  const claseEstado = estado === 0 ? 'off' : estado === 2 ? 'err' : 'ok';

  if(tipo === 0x0F && plano.length >= 14){              // Orion XS
    const vout = vNum(v.getInt16(2,true),  0x7FFF, 100);
    const iout = vNum(v.getInt16(4,true),  0x7FFF, 10);
    const vin  = vNum(v.getUint16(6,true), 0xFFFF, 100);
    const iin  = vNum(v.getUint16(8,true), 0xFFFF, 10);
    const off  = v.getUint32(10,true);
    const pin  = (vin !== null && iin !== null)   ? vin*iin   : null;
    const pout = (vout !== null && iout !== null) ? vout*iout : null;
    const efic = (pin > 1 && pout !== null) ? Math.min(100, pout/pin*100) : null;
    setChip(id, 'Conectado', 'ok');
    setCuerpo(id,
      hero(
        gauge((iout||0)/ORION_MAX_A, fN(iout,1) + '<span style="font-size:.45em;font-weight:600"> A</span>', fN(pout,0) + ' W', 'var(--lima)'),
        chips([[estadoChip, claseEstado]])
      ) +
      tiles([
        tile('V entrada', fN(vin,2), 'V'),
        tile('V salida', fN(vout,2), 'V'),
        tile('A entrada', fN(iin,2), 'A'),
        tile('A salida', fN(iout,2), 'A'),
        tile('W entrada', fN(pin,0), 'W'),
        tile('W salida', fN(pout,0), 'W'),
        tile('Eficiencia', efic === null ? '—' : efic.toFixed(0), '%'),
        tile('Error', err ? vicErrorTxt(err) : 'Ninguno', '', err ? 'err' : '')
      ]) +
      (off ? det('Motivo de apagado: <b>' + (vicMotivosApagado(off) || ('código 0x' + off.toString(16))) + '</b>') : '')
    );
  } else if(tipo === 0x01 && plano.length >= 10){        // SmartSolar MPPT
    const vbat = vNum(v.getInt16(2,true),  0x7FFF, 100);
    const ibat = vNum(v.getInt16(4,true),  0x7FFF, 10);
    const rend = vNum(v.getUint16(6,true), 0xFFFF, 0.1);   // 0.01 kWh = 10 Wh
    const pv   = vNum(v.getUint16(8,true), 0xFFFF, 1);
    if(pv !== null) con.pico = Math.max(con.pico, pv);
    // Carga (salida LOAD): 9 bits en 0,1 A; 0x1FF = no disponible
    const cargaRaw = plano.length >= 12 ? (v.getUint16(10,true) & 0x1FF) : 0x1FF;
    const iload = cargaRaw === 0x1FF ? null : cargaRaw / 10;
    const pload = (iload !== null && vbat !== null) ? iload * vbat : null;
    // Escala del medidor: potencia máxima teórica del 100/20 (20 A × tensión de batería) o el pico visto, el mayor
    const escala = Math.max(SOLAR_MAX_A * (vbat || 13), con.pico, 100);
    const pbat = (vbat !== null && ibat !== null) ? vbat*ibat : null;
    setChip(id, 'Conectado', 'ok');
    setCuerpo(id,
      hero(
        gauge((pv||0)/escala, fN(pv,0), 'W solares', 'var(--lima)'),
        chips([[estadoChip, claseEstado]])
      ) +
      tiles([
        tile('V batería', fN(vbat,2), 'V'),
        tile('A batería', fN(ibat,1), 'A'),
        tile('W al banco', fN(pbat,0), 'W'),
        tile('Rendimiento hoy', fN(rend,0), 'Wh'),
        tile('A carga (LOAD)', fN(iload,1), 'A'),
        tile('W carga (LOAD)', fN(pload,0), 'W'),
        tile('Pico sesión', fN(con.pico,0), 'W'),
        tile('Error', err ? vicErrorTxt(err) : 'Ninguno', '', err ? 'err' : '')
      ])
    );
  } else if(tipo === 0x04 && plano.length >= 10){        // Orion Smart DC-DC
    const vin  = vNum(v.getUint16(2,true), 0xFFFF, 100);
    const vout = vNum(v.getInt16(4,true),  0x7FFF, 100);
    const off  = v.getUint32(6,true);
    setChip(id, 'Conectado', 'ok');
    setCuerpo(id,
      hero('<div class="espera" style="padding:10px">DC-DC</div>', chips([[estadoChip, claseEstado]])) +
      tiles([ tile('Tensión entrada', fN(vin,2), 'V'), tile('Tensión salida', fN(vout,2), 'V') ]) +
      (off ? det('Motivo de apagado: <b>' + (vicMotivosApagado(off) || ('código 0x' + off.toString(16))) + '</b>') : '')
    );
  } else {
    setChip(id, 'Tipo 0x' + tipo.toString(16), 'warn');
    setCuerpo(id, '<div class="espera">Registro tipo 0x' + tipo.toString(16) + ' recibido (' + plano.length + ' bytes). Todavía no hay pantalla para este tipo.</div>');
  }
}

// Si pasan ~60 s sin una lectura válida, se reinicia la escucha del mismo equipo (sin volver a elegirlo en la lista)
async function reiniciarEscuchaVictron(con){
  if(con.reiniciando) return;
  con.reiniciando = true; con.ultReinicio = Date.now();
  con.nReinicios = (con.nReinicios || 0) + 1;
  try{
    log(con.rotulo + ': sin lecturas hace más de 60 s, reiniciando la escucha (#' + con.nReinicios + ')');
    try{ con.abort.abort(); }catch(e){}
    await sleep(800);
    if(!victronConex.has(con.id)) return;              // mientras tanto lo desconectaron
    con.abort = new AbortController();
    await con.dev.watchAdvertisements({signal: con.abort.signal});
    log(con.rotulo + ': escucha reiniciada');
  }catch(e){
    log(con.rotulo + ': no pude reiniciar la escucha: ' + e);
  }finally{ con.reiniciando = false; }
}

function tickVictron(con, ahora){
  const ref = con.ultima || con.inicio;
  if(!con.reiniciando && ahora - ref > 60000 && ahora - (con.ultReinicio || 0) > 60000) reiniciarEscuchaVictron(con);
  const seg = Math.round((ahora - con.inicio) / 1000);
  if(con.paquetes === 0){
    setPie(con.id, 'Escuchando hace ' + seg + ' s: todavía no llega ningún paquete. Cerrá Victron Connect, acercate al equipo y revisá que "Instant readout via Bluetooth" esté activado.', seg > 8 ? 'error' : 'aviso');
  } else if(con.victron === 0){
    setPie(con.id, 'Llegan ' + con.paquetes + ' paquetes pero ninguno trae datos Victron. Equipo elegido: «' + (con.nombre || '?') + '». Último paquete: ' + (con.detalle || '-') + '. Si Victron Connect está abierta, cerrala del todo.', 'error');
  } else if(con.decod === 0 && con.claveMala > 0){
    setPie(con.id, 'La clave NO coincide con este equipo (' + con.claveMala + ' paquetes rechazados). Copiá la clave de ESTE equipo.', 'error');
  } else if(con.decod === 0){
    setPie(con.id, 'Llegan datos pero no se pudieron descifrar. Mirá el diagnóstico.', 'error');
  } else {
    const s = Math.round((ahora - con.ultima) / 1000);
    if(s > 120){ setChip(con.id, 'Sin datos', 'warn'); setPie(con.id, 'Sin datos hace ' + s + ' s', 'aviso'); }
    else setPie(con.id, 'Última lectura: ' + horaDe(con.ultima), 'ok');
  }
}

/* =====================================================
   Daly BMS (app "Smart BMS") por Bluetooth
   ===================================================== */
const DALY_SERVICIOS = [0xFFF0, 0xFFE0];
const dl = { dev:null, chars:[], wr:null, buffer:new Uint8Array(0), vals:{}, cells:[], temps:[], bal:[],
             ultima:0, timer:null, timerMb:null, polling:false, a5:false, respA5:false, modo:'a5', pintar:null, tModbus:null, quiere:false, reconectando:false };

function dalyReset(){
  clearInterval(dl.timer); clearInterval(dl.timerMb); clearTimeout(dl.tModbus); clearTimeout(dl.pintar);
  Object.assign(dl, { dev:null, chars:[], wr:null, buffer:new Uint8Array(0), vals:{}, cells:[], temps:[], bal:[],
                      ultima:0, timer:null, timerMb:null, polling:false, a5:false, respA5:false, modo:'a5', pintar:null, tModbus:null, quiere:false, reconectando:false });
}

function tramaDaly(cmd){
  const b = new Uint8Array(13);
  b[0] = 0xA5; b[1] = 0x40; b[2] = cmd; b[3] = 0x08;
  let s = 0; for(let i=0;i<12;i++) s += b[i];
  b[12] = s & 0xFF;
  return b;
}
function crc16Modbus(u){
  let c = 0xFFFF;
  for(const x of u){ c ^= x; for(let i=0;i<8;i++) c = (c & 1) ? (c >> 1) ^ 0xA001 : c >> 1; }
  return c;
}
async function escribirDaly(u8){
  const p = dl.wr.properties;
  if(p.writeWithoutResponse) await dl.wr.writeValueWithoutResponse(u8);
  else await dl.wr.writeValue(u8);
}

// Abre la conexión y empieza a pedir datos. Se usa al conectar y en cada reconexión.
async function sesionDaly(dev, primera){
  const server = await dev.gatt.connect();
  let svc = null;
  for(const u of DALY_SERVICIOS){
    try{ svc = await server.getPrimaryService(u); if(primera) log('Daly: servicio 0x' + u.toString(16)); break; }catch(e){}
  }
  if(!svc) throw new Error('Este dispositivo no tiene el servicio Bluetooth del Daly (FFF0/FFE0). ¿Elegiste el módulo correcto? Suele llamarse "DL-…".');
  const chars = await svc.getCharacteristics();
  dl.chars = chars;
  if(primera){
    for(const c of chars){
      const pr = ['read','write','writeWithoutResponse','notify','indicate'].filter(k => c.properties[k]).join(',');
      log('Daly: característica ' + c.uuid.slice(4,8) + ' [' + pr + ']');
    }
  }
  // Escribe en la 0xFFF2 si existe (o en la primera que acepte escritura); escucha todas las que notifiquen
  dl.wr = chars.find(c => c.uuid.slice(4,8) === 'fff2' && (c.properties.write || c.properties.writeWithoutResponse))
       || chars.find(c => c.properties.write || c.properties.writeWithoutResponse);
  if(!dl.wr) throw new Error('No encontré una característica de escritura en el módulo Bluetooth.');
  let escuchando = 0;
  for(const c of chars){
    if(c.properties.notify || c.properties.indicate){
      await c.startNotifications();
      c.addEventListener('characteristicvaluechanged', e => recibirDaly(e.target.value));
      escuchando++;
    }
  }
  if(!escuchando) throw new Error('El módulo Bluetooth no ofrece notificaciones.');
  if(primera) log('Daly: escribiendo en ' + dl.wr.uuid.slice(4,8));
  dl.buffer = new Uint8Array(0); dl.polling = false;
  await sleep(300);
  clearInterval(dl.timer); clearInterval(dl.timerMb); dl.timerMb = null;
  // Siempre se sigue pidiendo en protocolo 0xA5 (el que informa Ah restantes y ciclos).
  pollDaly(); dl.timer = setInterval(pollDaly, 3000);
  // Si el A5 nunca respondió en esta conexión, se prueba además la variante Modbus
  if(!dl.respA5) dl.tModbus = setTimeout(() => { if(dl.dev === dev && !dl.respA5) probarModbusDaly(); }, 8000);
}

async function conectarDaly(){
  try{
    if(dl.dev && (dl.dev.gatt.connected || dl.reconectando)){ aviso('El Daly BMS ya está conectado.', 'warn'); return 'ok'; }
    const dev = await pedirDispositivo('Daly', [
      { acceptAllDevices:true, optionalServices:DALY_SERVICIOS },
      { acceptAllDevices:true, optionalServices:DALY_SERVICIOS.map(uuid128) }
    ]);
    dalyReset(); dl.dev = dev;
    tarjeta('daly', 'Daly BMS', dev.name || '');
    setChip('daly', 'Conectando', 'off');
    setCuerpo('daly', '<div class="espera">Conectando con el BMS…</div>');
    setPie('daly', '', '');
    dev.addEventListener('gattserverdisconnected', () => {
      if(dl.dev !== dev) return;
      clearInterval(dl.timer); dl.timer = null;
      log('Daly: desconectado');
      if(dl.quiere){ reconectarDaly(); }
      else { setChip('daly', 'Desconectado', 'err'); setPie('daly', 'Se perdió la conexión Bluetooth con el BMS.', 'error'); }
    });
    log('Daly: conectando a ' + dev.name);
    await sesionDaly(dev, true);
    setCuerpo('daly', '<div class="espera">Esperando datos del BMS…</div>');
    dl.quiere = true;                 // desde acá, si se corta, se reconecta solo
    aviso('');
    return 'ok';
  }catch(err){
    log('Daly error: ' + err);
    const k = clasificarError(err);
    if(k === 'gesto') return k;
    if(k === 'cancelado'){ aviso('Daly: no elegiste ningún dispositivo.', 'warn'); return k; }
    aviso('Daly: ' + err, 'err');
    if(document.getElementById('daly')){ setChip('daly', 'Error', 'err'); setPie('daly', String(err), 'error'); }
    return k;
  }
}

async function reconectarDaly(){
  if(dl.reconectando || !dl.quiere || !dl.dev) return;
  dl.reconectando = true;
  const dev = dl.dev; let n = 0;
  while(dl.quiere && dl.dev === dev){
    n++;
    setChip('daly', 'Reconectando', 'warn');
    setPie('daly', 'Conexión perdida. Reintentando… (intento ' + n + ')', 'aviso');
    await sleep(Math.min(2000 + n * 1500, 10000));
    if(!(dl.quiere && dl.dev === dev)) break;
    try{
      await sesionDaly(dev, false);
      dl.ultima = 0;
      log('Daly: reconectado (intento ' + n + ')');
      break;
    }catch(e){
      log('Daly: reintento ' + n + ' falló: ' + e);
      try{ dev.gatt.disconnect(); }catch(_){}
    }
  }
  dl.reconectando = false;
}

async function pollDaly(){
  if(!dl.dev || !dl.dev.gatt.connected || !dl.wr || dl.polling) return;
  dl.polling = true;
  try{
    for(const cmd of [0x90,0x91,0x92,0x93,0x94,0x95,0x96,0x97,0x98]){
      await escribirDaly(tramaDaly(cmd));
      await sleep(90);
    }
  }catch(e){ log('Daly: error al pedir datos: ' + e); }
  finally{ dl.polling = false; }
}

async function probarModbusDaly(){
  try{
    log('Daly: sin respuesta en protocolo 0xA5, probando además la variante Modbus (0xD2)');
    const req = new Uint8Array([0xD2, 0x03, 0x00, 0x00, 0x00, 0x3E, 0, 0]);
    const c = crc16Modbus(req.slice(0, 6)); req[6] = c & 0xFF; req[7] = c >> 8;
    const pedir = async () => { try{ await escribirDaly(req); }catch(e){ log('Daly: ' + e); } };
    await pedir();
    clearInterval(dl.timerMb);
    dl.timerMb = setInterval(() => {
      if(dl.respA5){ clearInterval(dl.timerMb); dl.timerMb = null; return; }   // el A5 ya responde: no hace falta Modbus
      if(dl.dev && dl.dev.gatt.connected) pedir();
    }, 3000);
  }catch(e){ log('Daly Modbus error: ' + e); }
}

function recibirDaly(dv){
  const chunk = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  const nuevo = new Uint8Array(dl.buffer.length + chunk.length);
  nuevo.set(dl.buffer); nuevo.set(chunk, dl.buffer.length);
  dl.buffer = nuevo;
  if(dl.buffer[0] === 0xD2){ procesarModbusDaly(); return; }
  let b = dl.buffer;
  while(b.length >= 13){
    const i = b.indexOf(0xA5);
    if(i < 0){ b = new Uint8Array(0); break; }
    if(i > 0) b = b.slice(i);
    if(b.length < 13) break;
    let s = 0; for(let k=0;k<12;k++) s += b[k];
    if(b[1] === 0x01 && b[3] === 0x08 && (s & 0xFF) === b[12]){
      dl.a5 = true; dl.respA5 = true; dl.modo = 'a5'; dl.ultima = Date.now();
      procesarFrameDaly(b.slice(0, 13));
      b = b.slice(13);
    } else {
      b = b.slice(1);
    }
  }
  dl.buffer = b;
}

function procesarFrameDaly(f){
  const cmd = f[2], d = f.slice(4, 12);
  const v = new DataView(d.buffer, d.byteOffset, 8);
  const V = dl.vals;
  if(cmd === 0x90){
    V.voltaje = v.getUint16(0) / 10;
    V.corriente = (v.getUint16(4) - 30000) / 10;
    V.soc = v.getUint16(6) / 10;
  } else if(cmd === 0x91){
    V.maxCelda = v.getUint16(0) / 1000; V.maxN = d[2];
    V.minCelda = v.getUint16(3) / 1000; V.minN = d[5];
  } else if(cmd === 0x92){
    V.tMax = d[0] - 40; V.tMaxN = d[1]; V.tMin = d[2] - 40; V.tMinN = d[3];
  } else if(cmd === 0x93){
    V.estado = d[0]; V.mosCarga = d[1]; V.mosDescarga = d[2]; V.capRest = v.getUint32(4) / 1000;
  } else if(cmd === 0x94){
    V.nCeldas = d[0]; V.nTemps = d[1]; V.ciclos = v.getUint16(5);
  } else if(cmd === 0x95){
    const n = d[0];
    if(n >= 1 && n < 0xFF){
      for(let k=0;k<3;k++){
        const idx = (n - 1) * 3 + k;
        if(idx < 32) dl.cells[idx] = v.getUint16(1 + 2*k) / 1000;
      }
    }
  } else if(cmd === 0x96){
    const n = d[0];
    if(n >= 1 && n < 0xFF){
      for(let k=0;k<7;k++){
        const idx = (n - 1) * 7 + k;
        if(idx < 8) dl.temps[idx] = d[1 + k] - 40;
      }
    }
  } else if(cmd === 0x97){
    dl.bal = [];
    for(let i=0;i<6;i++) for(let j=0;j<8;j++) if(d[i] & (1 << j)) dl.bal.push(i*8 + j + 1);
    V.balLeido = true;
  } else if(cmd === 0x98){
    V.fallas = Array.from(d.slice(0, 7));
  }
  programarPintarDaly();
}

function programarPintarDaly(){
  if(dl.pintar) return;
  dl.pintar = setTimeout(() => { dl.pintar = null; pintarDaly(); }, 150);
}

// Variante Modbus (series H/K/M/S): decodificación EXPERIMENTAL de lo básico
function procesarModbusDaly(){
  const b = dl.buffer;
  if(b.length < 3) return;
  if(b[0] !== 0xD2){ dl.buffer = new Uint8Array(0); return; }
  const total = 3 + b[2] + 2;
  if(b.length < total) return;
  const fr = b.slice(0, total); dl.buffer = b.slice(total);
  log('Daly Modbus (' + fr.length + ' bytes): ' + hexDe(fr));
  if(b[1] !== 0x03 || fr[2] < 0x56) return;
  const r = i => (fr[3 + 2*i] << 8) | fr[4 + 2*i];
  dl.cells = []; for(let i=0;i<32;i++){ const mv = r(i); if(mv > 0 && mv < 6000) dl.cells[i] = mv / 1000; }
  dl.temps = []; for(let i=0;i<8;i++){ const t = r(0x20 + i); if(t > 0 && t < 255) dl.temps[i] = t - 40; }
  const V = dl.vals;
  V.voltaje = r(0x28) / 10; V.corriente = (r(0x29) - 30000) / 10; V.soc = r(0x2A) / 10;
  V.nCeldas = dl.cells.filter(x => x !== undefined).length;
  dl.a5 = true; if(!dl.respA5) dl.modo = 'modbus'; dl.ultima = Date.now();
  programarPintarDaly();
}

function capacidadGuardadaDaly(){ try{ const v = parseFloat(localStorage.getItem('dalyAh')); return v > 0 ? v : null; }catch(e){ return null; } }
function capacidadDaly(){
  const v = prompt('Capacidad total de la batería del Daly en Ah (ej. 70). Se usa para calcular los Ah restantes.', capacidadGuardadaDaly() || '');
  if(v === null) return;
  const n = parseFloat(String(v).replace(',', '.'));
  try{ if(n > 0) localStorage.setItem('dalyAh', String(n)); else localStorage.removeItem('dalyAh'); }catch(e){}
  pintarDaly();
}
function pintarDaly(){
  if(!dl.dev) return;
  const V = dl.vals, modbus = dl.modo === 'modbus';
  const celdas = [];
  const n = V.nCeldas || dl.cells.length;
  for(let i=0;i<n;i++) if(dl.cells[i] !== undefined && dl.cells[i] > 0) celdas.push([i + 1, dl.cells[i]]);
  const vals = celdas.map(c => c[1]);
  const max = vals.length ? Math.max(...vals) : null, min = vals.length ? Math.min(...vals) : null;
  const prom = vals.length ? vals.reduce((a,b) => a + b, 0) / vals.length : null;
  const delta = (max !== null) ? (max - min) : null;
  const soc = V.soc, cor = V.corriente, vol = V.voltaje;
  const pot = (vol !== undefined && cor !== undefined) ? vol * cor : null;
  const sentido = cor === undefined ? '' : cor > 0.05 ? 'cargando' : cor < -0.05 ? 'descargando' : 'reposo';
  const tMax = V.tMax !== undefined ? V.tMax : (dl.temps.length ? Math.max(...dl.temps.filter(x => x !== undefined)) : null);
  const tMin = V.tMin !== undefined ? V.tMin : (dl.temps.length ? Math.min(...dl.temps.filter(x => x !== undefined)) : null);
  const balChip = modbus ? null :
    !V.balLeido ? ['Balance …', 'off'] :
    dl.bal.length ? ['Balance ON', 'bal'] : ['Balance OFF', 'off'];
  const fallas = V.fallas ? V.fallas.some(x => x) : null;
  if(fallas) alarma('daly', 'Daly BMS · alarma código ' + V.fallas.map(x => x.toString(16).padStart(2,'0')).join(' ').toUpperCase());
  else if(fallas === false) alarmaOk('daly');
  const chipsArr = [];
  if(V.mosCarga !== undefined) chipsArr.push(['Carga ' + (V.mosCarga ? 'ON' : 'OFF'), V.mosCarga ? 'ok' : 'err']);
  if(V.mosDescarga !== undefined) chipsArr.push(['Descarga ' + (V.mosDescarga ? 'ON' : 'OFF'), V.mosDescarga ? 'ok' : 'err']);
  if(balChip) chipsArr.push(balChip);
  const socN = soc === undefined ? 0 : soc;
  // Algunos Daly (variante Modbus) no informan los Ah restantes: se calculan con SOC × capacidad que cargues una vez
  const capDaly = V.capRest === undefined ? capacidadGuardadaDaly() : null;
  const restDaly = V.capRest !== undefined ? V.capRest : (capDaly && soc !== undefined ? capDaly * soc / 100 : undefined);

  setChip('daly', 'Conectado', 'ok');
  setCuerpo('daly',
    hero(
      gauge(socN/100, soc === undefined ? '—' : Math.round(soc) + '%', 'Estado de carga', colorSOC(socN)),
      chips(chipsArr)
    ) +
    tiles([
      tile('Voltaje', fN(vol,1), 'V'),
      tile('Corriente ' + (cor > 0.05 ? '▲' : cor < -0.05 ? '▼' : ''), fN(cor,1), 'A'),
      tile('Potencia', fN(pot,0), 'W'),
      tile(capDaly ? 'Restante*' : 'Restante', fN(restDaly,0), 'Ah', '', V.capRest === undefined ? 'onclick="capacidadDaly()" style="cursor:pointer" title="Tocá para cargar la capacidad de la batería"' : ''),
      tile('Temperatura', fN(tMax,0), '°C', tMax > 55 ? 'err' : tMax > 45 ? 'warn' : ''),
      tile('Dif. celdas', delta === null ? '—' : (delta*1000).toFixed(0), 'mV', delta > 0.1 ? 'err' : delta > 0.05 ? 'warn' : ''),
      tile('Celda prom.', fN(prom,3), 'V'),
      tile('Ciclos', V.ciclos === undefined ? '—' : String(V.ciclos), '')
    ]) +
    seccion('Celdas') +
    (celdas.length ?
      '<div class="celdas">' + celdas.map(([n, x]) => {
        const cls = (max !== min && x === max) ? 'max' : (max !== min && x === min) ? 'min' : '';
        return '<div class="celda ' + cls + '"><span>C' + n + '</span><b>' + x.toFixed(3) + '</b></div>';
      }).join('') + '</div>' : '<div class="espera" style="padding:14px">Leyendo celdas…</div>') +
    seccion('Alarmas') +
    det('<b>' + (fallas === null ? 'Leyendo…' : fallas ? 'Código ' + V.fallas.map(x => x.toString(16).padStart(2,'0')).join(' ').toUpperCase() : 'Sin alarmas') + '</b>')
  );
}

/* =====================================================
   REMOTO: el monitor local publica sus tarjetas cifradas y el monitor remoto las muestra igual.
   Se usa un intermediario público MQTT (por WebSocket, puerto 443): funciona detrás de cualquier router o red de celular.
   Un único PIN de acceso: de él salen la dirección (un resumen) y la clave de cifrado. Sin el PIN no se puede leer nada.
   ===================================================== */
const ALFA_COD = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const PIN_MIN = 8, PIN_MAX = 16;
const PIN_FIJO = '';   // PIN único y fijo del monitor (no cambia al refrescar). Vacío = se genera uno y se guarda en el navegador.
const BROKERS = () => window.MQTT_BROKERS || ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081'];
const pinNuevo = () => Array.from(crypto.getRandomValues(new Uint8Array(PIN_MIN))).map(x => ALFA_COD[x % ALFA_COD.length]).join('');
const fmtPin = c => c.length === 8 ? c.slice(0,4) + '-' + c.slice(4) : c;
const limpiarPin = t => String(t || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const pinValido = p => p.length >= PIN_MIN && p.length <= PIN_MAX;
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
const hex = u8 => Array.from(u8).map(b => b.toString(16).padStart(2, '0')).join('');
const b64 = u8 => { let s = ''; for(let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); };
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));

// Del PIN salen: el "tema" donde se publica (resumen, el servidor nunca ve el PIN) y la clave AES para cifrar los datos
async function pinClaves(pin){
  const enc = new TextEncoder();
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('fasstmon|' + pin)));
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:enc.encode('fasstmon-sal-v1'), iterations:100000, hash:'SHA-256' },
                                            base, { name:'AES-GCM', length:256 }, false, ['encrypt', 'decrypt']);
  return { tema: 'fasstmon/' + hex(h).slice(0, 24), key };
}
async function cifrar(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
  return b64(iv) + '.' + b64(ct);
}
async function descifrar(key, txt){
  const [a, c] = String(txt).split('.');
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(a) }, key, unb64(c));
  return JSON.parse(new TextDecoder().decode(pt));
}

// Conecta a TODOS los intermediarios públicos a la vez (así monitor y remoto siempre coinciden en alguno)
function mqttConectar(opciones, alConectar, alMensaje, alEstado, vigente){
  const clientes = [];
  BROKERS().forEach((url, n) => {
    let cli;
    try{ cli = mqtt.connect(url, Object.assign({ clean:true, reconnectPeriod:5000, connectTimeout:10000, keepalive:30 }, opciones, { clientId:opciones.clientId + '-' + n })); }
    catch(e){ alEstado('error', String(e)); return; }
    clientes.push(cli);
    cli.on('connect', () => { if(!vigente()){ try{ cli.end(true); }catch(e){} return; } alConectar(cli, url); });
    cli.on('message', (t, m) => alMensaje(t, m.toString()));
    cli.on('error', e => { alEstado('error', url.split('//')[1].split(':')[0] + ': ' + ((e && e.message) || String(e))); });
    cli.on('close', () => { if(!vigente()){ try{ cli.end(true); }catch(e){} return; } alEstado('cerrado', url); });
  });
  return clientes;
}
const hayConectado = lista => lista.some(c => c.connected);

function pildora(txt, clase){
  const p = $('pildora');
  if(MODO === 'local'){ const e = $('cr-est'); if(e){ e.textContent = txt.replace(/^REMOTO · ?/, ''); e.className = 'cr-e ' + (clase || ''); } if(p) p.textContent = ''; return; }
  if(p){ p.textContent = txt; p.className = 'ver rem ' + (clase || ''); }
}

/* ---------- Lado local: publica ---------- */
const rem = { clis:[], pin:null, tema:null, key:null, visores:new Map(), gen:0, ultimoEnvio:0, ultimoTxt:'' };
function remIniciarLocal(){
  // PIN fijo: se crea una vez y queda guardado en este navegador; no vence ni cambia solo
  if(pinValido(limpiarPin(PIN_FIJO))){
    rem.pin = limpiarPin(PIN_FIJO);
    const b = document.querySelector('#codrem [onclick="remCambiarPin()"]'); if(b) b.style.display = 'none';   // con PIN fijo no se cambia desde la pantalla
  } else {
    rem.pin = limpiarPin(lsGet('remPin'));
    if(!pinValido(rem.pin)){ rem.pin = pinNuevo(); lsSet('remPin', rem.pin); }
  }
  remAbrir();
  setInterval(remPublicar, 1000);
}
async function remAbrir(){
  $('cr-pin').textContent = fmtPin(rem.pin);
  if(typeof mqtt === 'undefined'){ pildora('REMOTO no disponible', 'warn'); return; }
  const gen = ++rem.gen;
  rem.clis.forEach(c => { try{ c.end(true); }catch(e){} });
  rem.clis = []; rem.visores.clear(); rem.ultimoTxt = ''; rem.ultimoEnvio = 0;
  pildora('REMOTO · conectando al servidor…', 'off');
  const { tema, key } = await pinClaves(rem.pin);
  if(gen !== rem.gen) return;
  rem.tema = tema; rem.key = key;
  const will = { topic: tema + '/estado', payload: await cifrar(key, { t:'offline' }), retain:true, qos:0 };
  rem.clis = mqttConectar({ clientId:'fm-h-' + hex(crypto.getRandomValues(new Uint8Array(6))), will },
    (cli, url) => {
      if(gen !== rem.gen) return;
      cli.subscribe(tema + '/v/+');
      log('Remoto: conectado al servidor ' + url.replace(/^wss:\/\//, '').split('/')[0]);
      remPildoraLocal(); rem.ultimoEnvio = 0; remPublicar();
    },
    (t, m) => { if(gen === rem.gen && t.startsWith(tema + '/v/')) rem.visores.set(t.slice(tema.length + 3), Date.now()); },
    (est, det) => {
      if(gen !== rem.gen) return;
      if(est === 'conectando') pildora('REMOTO · conectando al servidor…', 'off');
      else if(est === 'error'){ log('Remoto error: ' + det); pildora('REMOTO · reintentando… (' + det + ')', 'warn'); }
      else if(est === 'cerrado' && !hayConectado(rem.clis)){ pildora('REMOTO · reintentando…', 'warn'); }
    },
    () => gen === rem.gen);
}
function remContarVisores(){
  const lim = Date.now() - 15000;
  for(const [id, t] of rem.visores) if(t < lim) rem.visores.delete(id);
  return rem.visores.size;
}
function remPildoraLocal(){
  const n = remContarVisores();
  pildora('REMOTO · ' + n + (n === 1 ? ' visor' : ' visores'), n ? 'ok' : '');
}
async function remPublicar(){
  if(!hayConectado(rem.clis) || !rem.key) return;
  const n = remContarVisores(); remPildoraLocal();
  const ahora = Date.now();
  // Con visores se publica cada 2 s; sin visores, cada 15 s (queda guardado en el servidor para el que llegue)
  if(ahora - rem.ultimoEnvio < (n ? 2000 : 15000)) return;
  rem.ultimoEnvio = ahora;
  const estado = {
    t:'estado', ts:ahora,
    cards:[...document.querySelectorAll('#tarjetas > .card')].map(el => ({ id:el.id, html:el.outerHTML })),
    clima:$('clima').innerHTML,
    alarmas:[...new Set([...alarmasAct.values(), ...alarmasOff.values()])]
  };
  try{ const txt = await cifrar(rem.key, estado); rem.clis.forEach(c => { if(c.connected) c.publish(rem.tema + '/estado', txt, { retain:true, qos:0 }); }); }
  catch(e){ log('Remoto: no pude publicar: ' + e); }
}
function remCopiar(){
  const pin = fmtPin(rem.pin);
  try{ navigator.clipboard.writeText(pin).then(() => aviso('PIN ' + pin + ' copiado.', 'warn'), () => prompt('Copiá este PIN:', pin)); }
  catch(e){ prompt('Copiá este PIN:', pin); }
}
function remCambiarPin(){
  if(pinValido(limpiarPin(PIN_FIJO))) return;
  const v = prompt('PIN nuevo de acceso remoto (' + PIN_MIN + ' a ' + PIN_MAX + ' letras o números, sin espacios).\nSe guarda y sirve hasta que lo cambies. Los visores conectados se cortan.', fmtPin(rem.pin));
  if(v === null) return;
  const n = limpiarPin(v);
  if(!pinValido(n)){ aviso('El PIN debe tener entre ' + PIN_MIN + ' y ' + PIN_MAX + ' letras o números. Uno más corto sería fácil de adivinar.', 'err'); return; }
  rem.pin = n; lsSet('remPin', n);
  aviso('PIN cambiado a ' + fmtPin(n) + '.', 'warn');
  remAbrir();
}

/* ---------- Lado remoto: mira ---------- */
const vis = { clis:[], pin:null, key:null, tema:null, quiere:false, gen:0, ultimo:0, id:null, tPing:null, tSinDatos:null };
function visConectar(texto){
  const pin = limpiarPin(texto);
  if(!pinValido(pin)){ aviso('Ingresá el PIN de acceso que muestra el monitor (' + PIN_MIN + ' a ' + PIN_MAX + ' letras o números).', 'err'); $('rem-pin').focus(); return; }
  vis.pin = pin; vis.quiere = true; lsSet('remPinVer', pin);
  $('rem-pin').value = fmtPin(pin);
  aviso('');
  visAbrir();
}
async function visPegar(){
  try{
    const t = await navigator.clipboard.readText();
    if(pinValido(limpiarPin(t))){ visConectar(t); return; }
    aviso('Lo que hay copiado no parece un PIN de acceso. Copialo desde el monitor y probá de nuevo.', 'warn');
  }catch(e){
    aviso('El navegador no dejó leer lo copiado. Pegalo a mano en la caja y tocá "Conectar remoto".', 'warn');
    $('rem-pin').focus();
  }
}
function visCerrar(){
  clearInterval(vis.tPing); clearTimeout(vis.tSinDatos);
  vis.clis.forEach(c => { try{ c.end(true); }catch(e){} });
  vis.clis = []; vis.ultimo = 0; vis.datos = false;
}
function visDesconectar(){
  vis.quiere = false; vis.gen++; visCerrar();
  $('tarjetas').innerHTML = ''; $('vacio').style.display = 'block';
  alarmasAct.clear(); alarmasOff.clear(); pintarAlarmas();
  pildora('REMOTO · desconectado', 'off'); aviso('');
}
async function visAbrir(){
  if(typeof mqtt === 'undefined'){ aviso('No cargó la librería remota.', 'err'); return; }
  if(!window.crypto || !crypto.subtle){ aviso('Este navegador bloquea el cifrado cuando la página se abre como archivo o por http. Abrí el remoto desde un link https:// (hosting) y funciona.', 'err'); log('Remoto: sin crypto.subtle (' + location.protocol + ')'); return; }
  visCerrar();
  const gen = ++vis.gen;
  log('Remoto: versión 2.22, página ' + location.protocol + ', conectando…');
  pildora('REMOTO · conectando al servidor…', 'off');
  const { tema, key } = await pinClaves(vis.pin);
  if(gen !== vis.gen) return;
  vis.tema = tema; vis.key = key; vis.id = hex(crypto.getRandomValues(new Uint8Array(6)));
  vis.clis = mqttConectar({ clientId:'fm-v-' + vis.id },
    (cli, url) => {
      if(gen !== vis.gen) return;
      vis.ultimo = Date.now();
      log('Remoto: conectado al servidor ' + url.replace(/^wss:\/\//, '').split('/')[0] + ', buscando al monitor');
      pildora('REMOTO · buscando al monitor…', 'off');
      cli.subscribe(tema + '/estado');
      const ping = () => vis.clis.forEach(c => { try{ if(c.connected) c.publish(tema + '/v/' + vis.id, '1', { qos:0 }); }catch(e){} });
      ping(); clearInterval(vis.tPing); vis.tPing = setInterval(ping, 5000);
      clearTimeout(vis.tSinDatos);
      vis.tSinDatos = setTimeout(() => { if(gen === vis.gen && !vis.datos) aviso('No llegan datos con ese PIN. Revisá que esté bien escrito y que el monitor esté abierto y con internet. Sigo esperando…', 'warn'); }, 12000);
    },
    async (t, m) => {
      if(gen !== vis.gen || t !== vis.tema + '/estado') return;
      let est; try{ est = await descifrar(vis.key, m); }catch(e){ log('Remoto: un mensaje no se pudo descifrar'); return; }
      visRecibir(est);
    },
    (est, det) => {
      if(gen !== vis.gen || !vis.quiere) return;
      if(est === 'error'){ log('Remoto error: ' + det); pildora('REMOTO · sin señal (' + det + ')', 'warn'); }
      else if(est === 'cerrado' && !hayConectado(vis.clis)){ pildora('REMOTO · reintentando…', 'warn'); }
    },
    () => gen === vis.gen && vis.quiere);
}
function visRecibir(m){
  if(!m || typeof m !== 'object') return;
  vis.ultimo = Date.now();
  if(m.t === 'offline'){
    pildora('REMOTO · monitor desconectado', 'warn');
    aviso('El monitor se desconectó o cerró la página. Cuando vuelva, esto se actualiza solo.', 'warn');
    vis.datos = false; return;
  }
  if(m.t !== 'estado') return;
  if(!vis.datos){ vis.datos = true; pildora('REMOTO · en línea', 'ok'); aviso(''); }
  const ids = m.cards.map(c => c.id);
  for(const el of [...document.querySelectorAll('#tarjetas > .card')]) if(!ids.includes(el.id)) el.remove();
  for(const c of m.cards){
    const caja = document.createElement('div'); caja.innerHTML = c.html;
    const nuevo = caja.firstElementChild; if(!nuevo) continue;
    const viejo = document.getElementById(c.id);
    if(viejo) viejo.replaceWith(nuevo); else $('tarjetas').appendChild(nuevo);
  }
  for(const id of ids){ const el = document.getElementById(id); if(el) $('tarjetas').appendChild(el); }
  $('vacio').style.display = ids.length ? 'none' : 'block';
  $('clima').innerHTML = m.clima;
  const set = new Set(m.alarmas);
  for(const k of [...alarmasAct.keys(), ...alarmasOff.keys()]) if(!set.has(k)) alarmaOk(k);
  for(const msg of set) alarma(msg, msg);
}
setInterval(() => {
  if(MODO === 'remoto' && vis.quiere && vis.datos && vis.ultimo && Date.now() - vis.ultimo > 25000){
    pildora('REMOTO · sin señal', 'warn');
    aviso('No llegan datos del monitor hace más de 25 s. Puede que se haya cerrado o perdido internet.', 'warn');
    vis.datos = false;
  }
}, 3000);

// Al cerrar o recargar la página se avisa al servidor para que no queden conexiones colgadas
window.addEventListener('pagehide', () => { rem.clis.concat(vis.clis).forEach(c => { try{ c.end(true); }catch(e){} }); });
window.addEventListener('load', () => {
  if(MODO === 'remoto'){
    document.body.classList.add('modo-remoto');
    $('vacio').textContent = 'Ingresá el PIN de acceso que muestra el monitor y tocá "Conectar remoto".';
    pildora('REMOTO · desconectado', 'off');
    $('rem-pin').addEventListener('keydown', e => { if(e.key === 'Enter') visConectar($('rem-pin').value); });
    const ini = new URLSearchParams(location.search).get('p') || lsGet('remPinVer') || '';
    $('rem-pin').value = fmtPin(limpiarPin(ini));
    if(pinValido(limpiarPin(ini))) visConectar(ini);
  } else {
    remIniciarLocal();
  }
});
